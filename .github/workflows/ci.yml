name: CI and GHCR

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'

jobs:
  python:
    name: Python and dbt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install and verify locked dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dbt --version
      - name: Initialize fixtures and run dbt
        shell: pwsh
        run: |
          $env:WAREHOUSE_PATH = Join-Path $env:GITHUB_WORKSPACE 'data/ci.duckdb'
          python -m ecommerce.load --fixture-dir tests/fixtures
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dbt debug --project-dir analytics --profiles-dir analytics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dbt build --project-dir analytics --profiles-dir analytics
      - name: Run Python suite
        shell: pwsh
        run: |
          $testTmp = Join-Path $env:GITHUB_WORKSPACE "data/pytest-$([guid]::NewGuid())"
          python -m pytest -q --basetemp $testTmp -p no:cacheprovider

  container:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Linux image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag ecommerce-mvp:ci .
      - name: Verify fixture API and volume persistence
        shell: pwsh
        run: ./scripts/Test-DockerImage.ps1 -Image ecommerce-mvp:ci
      - name: Save the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker image inspect --format '{{.Id}}' ecommerce-mvp:ci > image-id.txt
          docker save ecommerce-mvp:ci | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: validated-image
          path: |
            image.tar.gz
            image-id.txt
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  publish:
    name: Publish approved image to GHCR
    needs: [python, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GHCR_APPROVED_SHA == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-image
      - name: Verify image identity and push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load --input image.tar.gz
          test "$(docker image inspect --format '{{.Id}}' ecommerce-mvp:ci)" = "$(cat image-id.txt)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag ecommerce-mvp:ci "$image"
          docker push "$image"
          docker image inspect --format '{{json .RepoDigests}}' "$image" >> "$GITHUB_STEP_SUMMARY"
