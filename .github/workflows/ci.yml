name: CI and GHCR

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AI_ENABLED: 'false'
  DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
  ECOMMERCE_IMAGE: ecommerce-mvp:ci

jobs:
  python:
    name: Python and dbt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install and verify locked dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dbt --version
      - name: Initialize fixtures and run dbt
        shell: pwsh
        run: |
          $env:WAREHOUSE_PATH = Join-Path $env:GITHUB_WORKSPACE 'data/ci.duckdb'
          python -m ecommerce.load --fixture-dir tests/fixtures
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dbt debug --project-dir analytics --profiles-dir analytics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dbt build --project-dir analytics --profiles-dir analytics
      - name: Run Python suite
        shell: pwsh
        run: |
          $testTmp = Join-Path $env:GITHUB_WORKSPACE "data/pytest-$([guid]::NewGuid())"
          python -m pytest -q --basetemp $testTmp -p no:cacheprovider

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container:
    name: Build and validate the full-stack image
    needs: [python, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_SMOKE_PROJECT: ecommerce-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build full-stack Linux image
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$ECOMMERCE_IMAGE" .
      - name: Run the Python suite offline inside the image
        run: |
          docker run --rm --network none --tmpfs /tmp:rw,nosuid,nodev,mode=1777 "$ECOMMERCE_IMAGE" \
            python -m pytest -q --basetemp /tmp/pytest-ecommerce -p no:cacheprovider
      - name: Verify the full-stack fixture service and volume persistence
        shell: pwsh
        timeout-minutes: 10
        run: |
          $marker = Join-Path $env:RUNNER_TEMP "$env:CI_SMOKE_PROJECT.owner"
          ./scripts/Test-FullStack.ps1 -Project $env:CI_SMOKE_PROJECT -Image $env:ECOMMERCE_IMAGE -CleanupVolumes -CleanupMarker $marker
      - name: Clean up the isolated smoke project
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          marker="$RUNNER_TEMP/$CI_SMOKE_PROJECT.owner"
          if [[ -f "$marker" && "$(cat "$marker")" = "$CI_SMOKE_PROJECT" ]]; then
            cleanup_status=0
            helpers=$(docker ps -aq --filter "label=ecommerce.smoke.project=$CI_SMOKE_PROJECT") || cleanup_status=$?
            if [[ -n "$helpers" ]]; then
              mapfile -t helper_ids <<< "$helpers"
              docker rm -f "${helper_ids[@]}" || cleanup_status=$?
            fi
            docker compose --project-name "$CI_SMOKE_PROJECT" --env-file .env.example down --volumes --remove-orphans || cleanup_status=$?
            exit "$cleanup_status"
          fi
      - name: Save the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker image inspect --format '{{.Id}}' "$ECOMMERCE_IMAGE" > image-id.txt
          docker save "$ECOMMERCE_IMAGE" | gzip -1 > image.tar.gz
          sha256sum image.tar.gz > image.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: validated-image-${{ github.sha }}
          path: |
            image.tar.gz
            image-id.txt
            image.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  publish:
    name: Publish approved image to GHCR
    needs: [container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GHCR_APPROVED_SHA == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-image-${{ github.sha }}
      - name: Verify image identity and push
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum --check image.tar.gz.sha256
          docker load --input image.tar.gz
          test "$(docker image inspect --format '{{.Id}}' "$ECOMMERCE_IMAGE")" = "$(cat image-id.txt)"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$ECOMMERCE_IMAGE")" = "$GITHUB_SHA"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag "$ECOMMERCE_IMAGE" "$image"
          docker push "$image"
          docker image inspect --format '{{json .RepoDigests}}' "$image" >> "$GITHUB_STEP_SUMMARY"
