services:
  app:
    image: "${ECOMMERCE_IMAGE:-ecommerce-fullstack:local}"
    build: .
    ports:
      - "127.0.0.1:${ECOMMERCE_PORT:-8000}:8000"
    environment:
      AI_ENABLED: "false"
      AI_DOCKER_TRUSTED_PEER: "${ECOMMERCE_GATEWAY:-172.30.80.1}"
    volumes:
      - warehouse:/data:ro
      - usage:/usage
    networks:
      - application

  refresh:
    image: "${ECOMMERCE_IMAGE:-ecommerce-fullstack:local}"
    profiles: ["maintenance"]
    command: ["python", "-m", "ecommerce.refresh", "--fixture-dir", "tests/fixtures"]
    volumes:
      - warehouse:/data

volumes:
  warehouse:
  usage:

networks:
  application:
    driver: bridge
    ipam:
      config:
        - subnet: "${ECOMMERCE_SUBNET:-172.30.80.0/24}"
          gateway: "${ECOMMERCE_GATEWAY:-172.30.80.1}"
